name: Demo en testnet
# Despliega un círculo de prueba en Stellar testnet con cuentas efímeras
# (creadas y fondeadas con Friendbot dentro del propio job, sin secretos),
# juega tres rondas reales y publica el resultado en testnet.json.
on:
  workflow_dispatch:
    inputs:
      periodo:
        description: "Segundos por ronda"
        default: "120"
      registro:
        description: "Id de un registro ya desplegado (vacío para crear uno nuevo)"
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Rust con destino wasm
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Stellar CLI
        run: curl -sSL https://github.com/stellar/stellar-cli/releases/download/v30.0.1/stellar-cli-30.0.1-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin stellar
      # Compilación verificable (SEP-55): el wasm lleva el repositorio de origen en sus
      # metadatos y GitHub firma su procedencia; Stellar Lab y Stellar Expert lo muestran
      # como "build verificado" y enlazan el código fuente.
      - name: Compilar wasm con metadatos de origen
        run: stellar contract build --meta source_repo=github:${{ github.repository }} --meta home_domain=awayu-two.vercel.app
      - name: Atestar la procedencia de los wasm
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/wasm32v1-none/release/*.wasm
      # Release con los wasm exactos que se despliegan y aviso a la API de validación
      # de Stellar Expert (como el soroban-build-workflow oficial); Stellar Lab lo lee.
      - name: Publicar los wasm y pedir la validación del código
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="contratos-${{ github.workflow == 'Demo en testnet' && 'demo' || 'modos' }}-${{ github.run_id }}"
          gh release create "$TAG" target/wasm32v1-none/release/*.wasm --title "$TAG" --notes "Wasm compilados en ${{ github.workflow }} (commit ${{ github.sha }}) con atestación de procedencia; son los que se despliegan en Stellar testnet."
          for w in target/wasm32v1-none/release/*.wasm; do
            h=$(sha256sum "$w" | cut -d' ' -f1)
            body=$(printf '{"repository":"%s","commitHash":"%s","jobId":"%s","runId":"%s","contractHash":"%s","packageName":"%s"}' "${{ github.server_url }}/${{ github.repository }}" "${{ github.sha }}" "${{ github.job }}" "${{ github.run_id }}" "$h" "$(basename "$w" .wasm)")
            echo "$body"
            for net in testnet public; do curl -s -X POST "https://api.stellar.expert/explorer/$net/contract-validation/match" -H "Content-Type: application/json" -d "$body" --max-time 15 || true; echo; done
            echo
          done
      - name: Desplegar y jugar rondas
        env:
          REGISTRO: ${{ inputs.registro }}
        run: bash scripts/demo-testnet.sh "${{ inputs.periodo }}"
      - uses: actions/upload-artifact@v4
        with:
          name: testnet
          path: testnet.json
