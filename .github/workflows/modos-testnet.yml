name: Tradiciones en testnet
# Despliega Ayni, Minka y Alasitas en Stellar testnet con cuentas efímeras
# (Friendbot, sin secretos), les da actividad real y publica modos.json.
on:
  workflow_dispatch:

jobs:
  modos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Rust con destino wasm
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Stellar CLI
        run: curl -sSL https://github.com/stellar/stellar-cli/releases/download/v30.0.1/stellar-cli-30.0.1-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin stellar
      - name: Compilar wasm
        run: stellar contract build
      - name: Desplegar y dar actividad
        run: bash scripts/modos-testnet.sh
      - uses: actions/upload-artifact@v4
        with:
          name: modos
          path: modos.json
