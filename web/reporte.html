<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reporte de historial de pagos · Awayu</title>
    <meta name="description" content="Reporte verificable del historial de pagos de una cuenta en los círculos de Awayu, leído directamente de los contratos Soroban en Stellar." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="reporte" aria-live="polite">
      <header class="r-head">
        <div class="r-brand"><span class="r-weave" aria-hidden="true"></span><b>Awayu</b></div>
        <div class="r-actions">
          <label class="r-field"><span id="r-account-label">Cuenta</span> <input id="r-addr" spellcheck="false" placeholder="G…" /></label>
          <button id="r-load" type="button">Ver reporte</button>
          <button id="r-print" type="button">Imprimir o guardar PDF</button>
          <label class="r-lang-field"><span id="r-lang-label">Idioma</span>
            <select id="r-lang" aria-label="Idioma">
              <option value="es">Español</option><option value="en">English</option><option value="pt">Português</option>
              <option value="qu">Runa Simi</option><option value="ay">Aymar aru</option><option value="gn">Avañe’ẽ</option>
            </select>
          </label>
        </div>
      </header>
      <section id="r-body"><p class="r-muted">Leyendo los contratos en Stellar…</p></section>
    </main>
    <script type="module" src="/src/reporte.js"></script>
  </body>
</html>
